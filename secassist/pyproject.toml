[project]
name = "secassist"
version = "0.1.0"
description = "KI-gestützter Sicherheits-Assistent für autorisierte Prüfungen (Code, Web/API, Infrastruktur)"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.12",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
secassist = "secassist.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["secassist"]
